# Targets bidder-prod but isn't in the gate's pairing table, so the gate always rejects it.
name: unpaired prod

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: bidder-prod
    steps:
      - name: Pretend to deploy
        run: echo "deploying $GITHUB_SHA to bidder-prod"
